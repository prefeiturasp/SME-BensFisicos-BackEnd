{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block object-tools-items %}
    {{ block.super }}
    {% if original %}
        {% if original.status == "aceita" %}
            <li>
                <a
                    href="{% url 'admin:baixafisica_nbbpm' original.pk %}"
                    class="button"
                    style="background: #198754; border-color: #198754; color: #fff;"
                >
                    Baixar NBBPM
                </a>
            </li>
        {% endif %}
    {% endif %}
{% endblock %}
