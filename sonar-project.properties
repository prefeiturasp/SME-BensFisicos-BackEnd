# Identificação do projeto no SonarQube
# Mesma chave usada no Jenkinsfile (stage AnaliseCodigo, branch homolog).
sonar.projectKey=SME-BensFisicos-BackEnd
sonar.projectName=SME-BensFisicos-BackEnd
sonar.projectVersion=2.7.0

# Diretórios do código-fonte (apps na raiz, sem mover para apps/)
sonar.sources=bem_patrimonial,usuario,inventario,dados_comuns,config

# Diretórios que contêm testes (suíte atual, 67 arquivos dentro dos apps)
sonar.tests=bem_patrimonial,usuario,inventario,dados_comuns
sonar.test.inclusions=**/tests/**/*.py,**/test_*.py

# Encoding dos arquivos
sonar.sourceEncoding=UTF-8

# Arquivos e diretórios que não devem ser analisados como código-fonte
sonar.exclusions=\
  **/migrations/**,\
  **/tests/**,\
  **/test_*.py,\
  **/factories.py,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/.mypy_cache/**,\
  **/.ruff_cache/**,\
  **/venv/**,\
  **/.venv/**,\
  **/env/**,\
  **/.git/**,\
  **/docs/**,\
  **/staticfiles/**,\
  **/static/**,\
  **/scripts/**,\
  config/settings/local.py,\
  config/wsgi.py,\
  config/asgi.py,\
  config/urls.py,\
  manage.py

# Helpers de teste que não devem contar como teste
sonar.test.exclusions=\
  **/factories.py

# Arquivos sem cobertura de negócio direta
sonar.coverage.exclusions=\
  **/migrations/**,\
  **/tests/**,\
  **/test_*.py,\
  **/factories.py,\
  **/apps.py,\
  **/admin.py,\
  manage.py,\
  config/**

# Relatório XML de cobertura gerado pelo Coverage.py
sonar.python.coverage.reportPaths=coverage.xml

# Versão Python utilizada pelo projeto
sonar.python.version=3.11
