repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        # Mesmos alvos do make lint.
        pass_filenames: false
        args: ["--line-length=120", "bem_patrimonial", "usuario", "inventario", "dados_comuns", "config", "manage.py"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v0.991
    hooks:
      - id: mypy
        stages: [pre-push]
        pass_filenames: false
        # 4 apps na raiz (sem apps/) + config
        args: ["--cache-dir=/tmp/.mypy_cache", "bem_patrimonial", "usuario", "inventario", "dados_comuns", "config"]
        additional_dependencies:
          # Versões alinhadas ao requirements.txt.
          # django-stubs 1.13.x: linha compatível com Django 4.1.
          # djangorestframework-stubs omitido: sem versão verificada para DRF 3.14.
          - django==4.1.3
          - django-stubs==1.13.2
          - djangorestframework==3.14.0
          - djangorestframework-simplejwt==5.3.1
          - drf-spectacular==0.27.0
          - django-environ==0.4.5
          - django-cors-headers==3.13.0
          - psycopg2-binary==2.9.9
